name: docs

# Build the Sphinx site and publish it to GitHub Pages. The package ships a
# compiled extension, so the docs build installs colstore (autodoc imports it)
# before running sphinx-build.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; never cancel an in-progress publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # setuptools_scm needs the full tag history
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install colstore + docs toolchain
        run: pip install ".[docs]"
      - name: Build HTML
        run: sphinx-build -b html --keep-going docs docs/_build/html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

  deploy:
    # Only publish from main; PRs build above to catch breakage but do not deploy.
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
