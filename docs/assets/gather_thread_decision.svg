<svg xmlns="http://www.w3.org/2000/svg" width="680" height="534" viewBox="0 0 680 534" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>How the gather thread count is decided</title>
<desc>Single-column reads use the full thread cap; multi-column reads pick one of three sub-routes that split or share the cap; both feed the kernel's resolve_thread_count, which scales the actual thread count with the work size and clamps it to the cap.</desc>
<style>
  .box { fill: #F1EFE8; stroke: #888780; stroke-width: 0.75; }
  .kbox { fill: #E1F5EE; stroke: #0F6E56; stroke-width: 0.75; }
  .dash { fill: none; stroke: #B4B2A9; stroke-width: 0.75; stroke-dasharray: 4 4; }
  .t { fill: #2C2C2A; font-size: 14px; font-weight: 500; }
  .ts { fill: #5F5E5A; font-size: 12px; font-weight: 400; }
  .kt { fill: #04342C; font-size: 14px; font-weight: 500; }
  .kts { fill: #0F6E56; font-size: 12px; font-weight: 400; }
  .lbl { fill: #5F5E5A; font-size: 12px; font-weight: 400; }
  .arr { stroke: #73726C; stroke-width: 1.25; fill: none; }
  @media (prefers-color-scheme: dark) {
    .box { fill: #2C2C2A; stroke: #888780; }
    .kbox { fill: #04342C; stroke: #1D9E75; }
    .dash { stroke: #5F5E5A; }
    .t { fill: #F1EFE8; } .ts { fill: #D3D1C7; }
    .kt { fill: #E1F5EE; } .kts { fill: #9FE1CB; }
    .lbl { fill: #B4B2A9; }
    .arr { stroke: #B4B2A9; }
  }
</style>
<defs>
  <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<rect class="box" x="55" y="40" width="250" height="56" rx="8"/>
<text class="t" x="180" y="64" text-anchor="middle">Single-column read</text>
<text class="ts" x="180" y="82" text-anchor="middle">ds[rows, "col"]</text>

<rect class="box" x="375" y="40" width="250" height="56" rx="8"/>
<text class="t" x="500" y="64" text-anchor="middle">Multi-column read</text>
<text class="ts" x="500" y="82" text-anchor="middle">dict / recarray / frame</text>

<line class="arr" x1="180" y1="96" x2="180" y2="128" marker-end="url(#ar)"/>
<line class="arr" x1="500" y1="96" x2="500" y2="128" marker-end="url(#ar)"/>

<rect class="box" x="55" y="132" width="250" height="56" rx="8"/>
<text class="t" x="180" y="156" text-anchor="middle">_gather_one</text>
<text class="ts" x="180" y="174" text-anchor="middle">runs at the full cap</text>

<rect class="box" x="375" y="132" width="250" height="56" rx="8"/>
<text class="t" x="500" y="156" text-anchor="middle">_gather_many</text>
<text class="ts" x="500" y="174" text-anchor="middle">selects one sub-route</text>

<line class="arr" x1="500" y1="188" x2="500" y2="220" marker-end="url(#ar)"/>

<rect class="dash" x="350" y="224" width="300" height="160" rx="10"/>
<text class="lbl" x="500" y="246" text-anchor="middle">one route is chosen</text>
<rect class="box" x="366" y="258" width="268" height="34" rx="6"/>
<text class="ts" x="500" y="279" text-anchor="middle">Mask &#183; sequential &#183; full cap</text>
<rect class="box" x="366" y="300" width="268" height="34" rx="6"/>
<text class="ts" x="500" y="321" text-anchor="middle">Bin-reuse &#183; wider of seq / pool</text>
<rect class="box" x="366" y="342" width="268" height="34" rx="6"/>
<text class="ts" x="500" y="363" text-anchor="middle">Generic pool &#183; cap &#247; workers</text>

<line class="arr" x1="180" y1="188" x2="180" y2="428" marker-end="url(#ar)"/>
<line class="arr" x1="500" y1="384" x2="500" y2="428" marker-end="url(#ar)"/>

<rect class="kbox" x="160" y="430" width="360" height="64" rx="8"/>
<text class="kt" x="340" y="456" text-anchor="middle">resolve_thread_count(n, cap)</text>
<text class="kts" x="340" y="476" text-anchor="middle">n &lt; 256K &#8594; 1, else min(cap, max(2, n/1M))</text>
</svg>
