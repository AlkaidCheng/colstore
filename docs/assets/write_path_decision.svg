<svg xmlns="http://www.w3.org/2000/svg" width="720" height="486" viewBox="0 0 720 486" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>How a write reaches disk</title>
<desc>Every write chooses one of two routes. A pure merge -- where every output column is an unchanged on-disk passthrough, as in a same-schema concat with no edits -- takes the merge-copy route, copying each source column's byte ranges straight into the output with no materialization. Any transform, new or dropped or renamed column, in-memory or constant column, or single source takes the streaming-write route, evaluating each column in bounded-memory batches and writing each batch out. Both routes fill the destination body with one fill method: pwrite, the default where os.pwrite exists, issuing large sequential writes; or mmap, the fallback (for example on Windows), using memory-mapped output.</desc>
<style>
  .box { fill: #F1EFE8; stroke: #888780; stroke-width: 0.75; }
  .kbox { fill: #E1F5EE; stroke: #0F6E56; stroke-width: 0.75; }
  .t { fill: #2C2C2A; font-size: 14px; font-weight: 500; }
  .ts { fill: #5F5E5A; font-size: 12px; font-weight: 400; }
  .kt { fill: #04342C; font-size: 14px; font-weight: 500; }
  .kts { fill: #0F6E56; font-size: 12px; font-weight: 400; }
  .lbl { fill: #5F5E5A; font-size: 12px; font-weight: 400; }
  .arr { stroke: #73726C; stroke-width: 1.25; fill: none; }
  @media (prefers-color-scheme: dark) {
    .box { fill: #2C2C2A; stroke: #888780; } .t { fill: #F1EFE8; } .ts { fill: #D3D1C7; }
    .kbox { fill: #04342C; stroke: #1D9E75; } .kt { fill: #E1F5EE; } .kts { fill: #9FE1CB; }
    .lbl { fill: #B4B2A9; } .arr { stroke: #B4B2A9; }
  }
</style>
<defs>
  <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<rect class="box" x="210" y="22" width="300" height="52" rx="8"/>
<text class="t" x="360" y="45" text-anchor="middle">write</text>
<text class="ts" x="360" y="63" text-anchor="middle">frame.write() &#183; concat(out=&#8230;) &#183; write_dataset</text>

<line class="arr" x1="360" y1="74" x2="360" y2="100" marker-end="url(#ar)"/>

<rect class="box" x="200" y="102" width="320" height="58" rx="8"/>
<text class="t" x="360" y="126" text-anchor="middle">pure merge?</text>
<text class="ts" x="360" y="145" text-anchor="middle">all output columns pass through unchanged</text>

<line class="arr" x1="265" y1="160" x2="188" y2="202" marker-end="url(#ar)"/>
<line class="arr" x1="455" y1="160" x2="532" y2="202" marker-end="url(#ar)"/>
<text class="lbl" x="205" y="186" text-anchor="middle">yes</text>
<text class="lbl" x="515" y="186" text-anchor="middle">no</text>

<rect class="kbox" x="45" y="204" width="270" height="60" rx="8"/>
<text class="kt" x="180" y="229" text-anchor="middle">Merge copy</text>
<text class="kts" x="180" y="248" text-anchor="middle">copy byte ranges &#8212; no materialization</text>

<rect class="kbox" x="405" y="204" width="270" height="60" rx="8"/>
<text class="kt" x="540" y="229" text-anchor="middle">Streaming write</text>
<text class="kts" x="540" y="248" text-anchor="middle">columns in bounded-memory batches</text>

<line class="arr" x1="180" y1="264" x2="285" y2="306" marker-end="url(#ar)"/>
<line class="arr" x1="540" y1="264" x2="435" y2="306" marker-end="url(#ar)"/>

<rect class="box" x="150" y="308" width="420" height="46" rx="8"/>
<text class="ts" x="360" y="335" text-anchor="middle">both routes fill the destination body with one of:</text>

<line class="arr" x1="300" y1="354" x2="230" y2="394" marker-end="url(#ar)"/>
<line class="arr" x1="420" y1="354" x2="490" y2="394" marker-end="url(#ar)"/>
<text class="lbl" x="248" y="380" text-anchor="middle">default</text>
<text class="lbl" x="472" y="380" text-anchor="middle">fallback</text>

<rect class="box" x="88" y="396" width="254" height="58" rx="8"/>
<text class="t" x="215" y="420" text-anchor="middle">pwrite</text>
<text class="ts" x="215" y="438" text-anchor="middle">large sequential writes</text>

<rect class="box" x="378" y="396" width="254" height="58" rx="8"/>
<text class="t" x="505" y="420" text-anchor="middle">mmap</text>
<text class="ts" x="505" y="438" text-anchor="middle">memory-mapped output</text>
</svg>
