<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Row-major streaming commit</title>
<desc>The commit preallocates a column-contiguous file and fills it one row range at a time. For each range it opens one shared memo, evaluates every output column for that range (so a shared subexpression is computed once), and scatter-writes each result into its column's region. The outer loop advances over row ranges; the inner loop walks the columns within a range. The batch row count is the memory budget divided by the bytes materialized per row, which bounds peak working memory.</desc>
<style>
  .colA { fill:#E1F5EE; stroke:#0F6E56; stroke-width:0.75; }
  .colB { fill:#FBF1DE; stroke:#B9852B; stroke-width:0.75; }
  .colC { fill:#E6EEF4; stroke:#3F6E9E; stroke-width:0.75; }
  .box  { fill:#F4F2EC; stroke:#5F5E5A; stroke-width:1; } .boxt { fill:#2C2C2A; font-size:12px; font-weight:600; }
  .now  { fill:none; stroke:#0F6E56; stroke-width:2; }
  .sep  { stroke:#5F5E5A; stroke-width:1; }
  .arr  { stroke:#73726C; stroke-width:1.25; fill:none; }
  .hd   { fill:#2C2C2A; font-size:13px; font-weight:600; }
  .lbl  { fill:#5F5E5A; font-size:11px; font-weight:400; }
  .mono { fill:#5F5E5A; font-size:11px; font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace; }
  @media (prefers-color-scheme: dark) {
    .colA { fill:#04342C; stroke:#1D9E75; }
    .colB { fill:#2E2613; stroke:#C9972F; }
    .colC { fill:#1B2A38; stroke:#5E8CBF; }
    .box  { fill:#26251F; stroke:#B4B2A9; } .boxt { fill:#F1EFE8; }
    .now  { stroke:#1D9E75; }
    .sep { stroke:#B4B2A9; } .arr { stroke:#B4B2A9; } .hd { fill:#F1EFE8; } .lbl { fill:#B4B2A9; } .mono { fill:#B4B2A9; }
  }
</style>
<defs>
  <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<text class="hd" x="40" y="28">Row-major streaming commit</text>

<!-- column region labels -->
<text class="lbl" x="378" y="62" text-anchor="middle">col A</text>
<text class="lbl" x="454" y="62" text-anchor="middle">col B</text>
<text class="lbl" x="530" y="62" text-anchor="middle">col C</text>

<!-- column regions -->
<rect class="colA" x="340" y="70" width="76" height="230"/>
<rect class="colB" x="416" y="70" width="76" height="230"/>
<rect class="colC" x="492" y="70" width="76" height="230"/>

<!-- row-range separators -->
<line class="sep" x1="340" y1="128" x2="568" y2="128"/>
<line class="sep" x1="340" y1="186" x2="568" y2="186"/>
<line class="sep" x1="340" y1="244" x2="568" y2="244"/>

<!-- current range highlight -->
<rect class="now" x="340" y="128" width="228" height="58"/>

<!-- memo box -->
<rect class="box" x="40" y="146" width="232" height="78"/>
<text class="boxt" x="52" y="168">per-range memo  { }</text>
<text class="lbl" x="52" y="188">shared nodes computed once;</text>
<text class="lbl" x="52" y="204">each column evaluated for</text>
<text class="lbl" x="52" y="218">the range [start : stop)</text>

<!-- memo -> current range -->
<path class="arr" d="M272 170 L336 157" marker-end="url(#ar)"/>

<!-- outer loop arrow -->
<path class="arr" d="M592 80 L592 292" marker-end="url(#ar)"/>
<text class="lbl" x="602" y="182">row ranges</text>
<text class="lbl" x="602" y="198">(outer loop)</text>

<!-- captions -->
<text class="lbl" x="454" y="318" text-anchor="middle">preallocated, column-contiguous file</text>
<text class="lbl" x="40" y="250">Within a range the columns fill in turn (inner loop);</text>
<text class="lbl" x="40" y="266">the outer loop then advances to the next row range.</text>

<!-- budget note -->
<text class="lbl" x="40" y="344">batch_rows = <tspan class="mono">budget // bytes_per_row</tspan>  &#8212;  bounds peak working memory.</text>
</svg>
