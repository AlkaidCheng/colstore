<svg xmlns="http://www.w3.org/2000/svg" width="700" height="360" viewBox="0 0 700 360" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Columns are expressions; a shared subexpression is computed once</title>
<desc>Each output column is an expression over leaves: native columns read from the source, in-memory assigned arrays, and constants, combined by operators and elementwise ufuncs. When several output columns reuse the same subexpression, it is one node with several parents. During a commit every column in a row range is evaluated through one shared memo, so that shared node is computed once per row range and reused by each column that references it, rather than recomputed once per column.</desc>
<style>
  .colA { fill:#E1F5EE; stroke:#0F6E56; stroke-width:0.75; } .colAt { fill:#04342C; font-size:11px; font-weight:500; }
  .colB { fill:#FBF1DE; stroke:#B9852B; stroke-width:0.75; } .colBt { fill:#6B4A12; font-size:12px; font-weight:500; }
  .colC { fill:#E6EEF4; stroke:#3F6E9E; stroke-width:0.75; } .colCt { fill:#234567; font-size:10px; font-weight:500; }
  .box  { fill:#F4F2EC; stroke:#5F5E5A; stroke-width:1; } .boxt { fill:#2C2C2A; font-size:12px; font-weight:500; }
  .cse  { fill:#EAE6F4; stroke:#6B5BA6; stroke-width:1.25; } .cset { fill:#3A2F66; font-size:12px; font-weight:600; }
  .arr  { stroke:#73726C; stroke-width:1.25; fill:none; }
  .hd   { fill:#2C2C2A; font-size:13px; font-weight:600; }
  .lbl  { fill:#5F5E5A; font-size:11px; font-weight:400; }
  @media (prefers-color-scheme: dark) {
    .colA { fill:#04342C; stroke:#1D9E75; } .colAt { fill:#9FE1CB; }
    .colB { fill:#2E2613; stroke:#C9972F; } .colBt { fill:#F0D9A6; }
    .colC { fill:#1B2A38; stroke:#5E8CBF; } .colCt { fill:#BBD2EA; }
    .box  { fill:#26251F; stroke:#B4B2A9; } .boxt { fill:#F1EFE8; }
    .cse  { fill:#241F33; stroke:#9C8BD6; } .cset { fill:#D6CCF0; }
    .arr { stroke:#B4B2A9; } .hd { fill:#F1EFE8; } .lbl { fill:#B4B2A9; }
  }
</style>
<defs>
  <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<text class="hd" x="40" y="28">Columns are expressions; a shared subexpression runs once</text>

<!-- output column heads -->
<rect class="colB" x="40"  y="70" width="150" height="38"/>
<text class="colBt" x="115" y="93" text-anchor="middle">c0 = shared &#183; 1</text>
<rect class="colB" x="275" y="70" width="150" height="38"/>
<text class="colBt" x="350" y="93" text-anchor="middle">c1 = shared &#183; 2</text>
<rect class="colB" x="510" y="70" width="150" height="38"/>
<text class="colBt" x="585" y="93" text-anchor="middle">c2 = shared &#183; 3</text>

<!-- shared node -> heads (fan out) -->
<path class="arr" d="M320 150 L150 110" marker-end="url(#ar)"/>
<path class="arr" d="M350 150 L350 110" marker-end="url(#ar)"/>
<path class="arr" d="M380 150 L555 110" marker-end="url(#ar)"/>

<!-- shared node -->
<rect class="cse" x="275" y="150" width="150" height="38"/>
<text class="cset" x="350" y="173" text-anchor="middle">log(ratio)  [shared]</text>

<!-- ratio -> shared -->
<path class="arr" d="M350 214 L350 190" marker-end="url(#ar)"/>

<!-- ratio node -->
<rect class="box" x="275" y="214" width="150" height="36"/>
<text class="boxt" x="350" y="237" text-anchor="middle">close / open</text>

<!-- leaves -> ratio -->
<path class="arr" d="M250 288 L325 252" marker-end="url(#ar)"/>
<path class="arr" d="M450 288 L375 252" marker-end="url(#ar)"/>

<!-- leaves -->
<rect class="colC" x="180" y="288" width="140" height="38"/>
<text class="colCt" x="250" y="311" text-anchor="middle">NativeColumn('close')</text>
<rect class="colC" x="380" y="288" width="140" height="38"/>
<text class="colCt" x="450" y="311" text-anchor="middle">NativeColumn('open')</text>

<!-- annotation -->
<text class="lbl" x="40" y="170">The shared node has three</text>
<text class="lbl" x="40" y="186">parents. It is evaluated once</text>
<text class="lbl" x="40" y="202">per row range through the</text>
<text class="lbl" x="40" y="218">per-range memo, not once</text>
<text class="lbl" x="40" y="234">per output column.</text>

<!-- legend -->
<rect class="colC" x="40"  y="338" width="13" height="13"/>
<text class="lbl" x="58"  y="349">NativeColumn</text>
<rect class="colB" x="180" y="338" width="13" height="13"/>
<text class="lbl" x="198" y="349">output column</text>
<rect class="box" x="330" y="338" width="13" height="13"/>
<text class="lbl" x="348" y="349">UFunc</text>
<rect class="cse" x="430" y="338" width="13" height="13"/>
<text class="lbl" x="448" y="349">shared subexpression</text>
</svg>
