<svg xmlns="http://www.w3.org/2000/svg" width="680" height="420" viewBox="0 0 680 420" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>NUMA placement decision</title>
<desc>The auto policy places pages by interleaving across nodes on a multi-node Linux host and otherwise leaves the kernel's local first-touch placement. Placement is fixed at the first fault, so warm pages cannot move and only a cold read places per policy. Whether the best cold-read placement depends on the access pattern is under measurement.</desc>
<style>
  .box { fill: #F1EFE8; stroke: #888780; stroke-width: 0.75; }
  .kbox { fill: #E1F5EE; stroke: #0F6E56; stroke-width: 0.75; }
  .dash { fill: #FBF1DE; stroke: #B9852B; stroke-width: 0.9; stroke-dasharray: 5 4; }
  .t { fill: #2C2C2A; font-size: 14px; font-weight: 500; }
  .ts { fill: #5F5E5A; font-size: 12px; font-weight: 400; }
  .kt { fill: #04342C; font-size: 14px; font-weight: 500; }
  .kts { fill: #0F6E56; font-size: 12px; font-weight: 400; }
  .at { fill: #6B4A12; font-size: 14px; font-weight: 500; }
  .ats { fill: #8A6320; font-size: 12px; font-weight: 400; }
  .lbl { fill: #5F5E5A; font-size: 12px; font-weight: 400; }
  .arr { stroke: #73726C; stroke-width: 1.25; fill: none; }
  @media (prefers-color-scheme: dark) {
    .box { fill: #2C2C2A; stroke: #888780; } .t { fill: #F1EFE8; } .ts { fill: #D3D1C7; }
    .kbox { fill: #04342C; stroke: #1D9E75; } .kt { fill: #E1F5EE; } .kts { fill: #9FE1CB; }
    .dash { fill: #2E2613; stroke: #C9972F; } .at { fill: #F0D9A6; } .ats { fill: #D9B871; }
    .lbl { fill: #B4B2A9; } .arr { stroke: #B4B2A9; }
  }
</style>
<defs>
  <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<rect class="box" x="215" y="30" width="250" height="56" rx="8"/>
<text class="t" x="340" y="54" text-anchor="middle">numa_policy = auto</text>
<text class="ts" x="340" y="72" text-anchor="middle">the placement default</text>

<line class="arr" x1="320" y1="86" x2="200" y2="148" marker-end="url(#ar)"/>
<line class="arr" x1="360" y1="86" x2="480" y2="148" marker-end="url(#ar)"/>
<text class="lbl" x="232" y="120" text-anchor="middle">&#8805; 2 NUMA nodes</text>
<text class="lbl" x="452" y="120" text-anchor="middle">1 node / local</text>

<rect class="kbox" x="55" y="150" width="250" height="56" rx="8"/>
<text class="kt" x="180" y="174" text-anchor="middle">Interleave</text>
<text class="kts" x="180" y="192" text-anchor="middle">spread pages across nodes</text>

<rect class="box" x="375" y="150" width="250" height="56" rx="8"/>
<text class="t" x="500" y="174" text-anchor="middle">Local first-touch</text>
<text class="ts" x="500" y="192" text-anchor="middle">pages near the reader</text>

<line class="arr" x1="180" y1="206" x2="180" y2="256" marker-end="url(#ar)"/>
<line class="arr" x1="500" y1="206" x2="500" y2="256" marker-end="url(#ar)"/>

<rect class="box" x="55" y="256" width="570" height="44" rx="8"/>
<text class="ts" x="340" y="282" text-anchor="middle">Fixed at first fault: warm pages stay put; a cold read places per policy.</text>

<line class="arr" x1="340" y1="300" x2="340" y2="336" marker-end="url(#ar)"/>

<rect class="dash" x="140" y="336" width="400" height="64" rx="10"/>
<text class="at" x="340" y="361" text-anchor="middle">Per-pattern cold-read placement</text>
<text class="ats" x="340" y="381" text-anchor="middle">does the winner flip by access pattern? &#8212; measuring (this PR)</text>
</svg>
